<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HasGames</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- PeerJS: WebRTC peer-to-peer connections + free public signaling server -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <!-- Phaser: browser game framework (rendering, physics, input, scenes) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
</head>
<body>
  <section id="lobby">
    <h1>HasGames</h1>
    <input id="name" maxlength="12" placeholder="Your name">
    <button id="host-btn">Host game</button>
    <div class="join-row">
      <input id="code" maxlength="5" placeholder="Room code">
      <button id="join-btn">Join</button>
    </div>
    <p id="status"></p>
  </section>

  <section id="game" hidden>
    <div id="hud"><span id="room-label"></span> <span id="player-list"></span></div>
    <div id="game-container"></div>
    <p class="hint">Move A/D · Sprint Shift · Jump W/Space · Crouch S · Interact E · Abilities J / K · (dev) role 1–4 · dummy 0 · switch control Tab · unlock all 9 · full speed 8</p>
  </section>

  <script>
    // Always load the newest game files (see sw.js). The very first time the worker takes over,
    // reload once so this visit also gets fresh files instead of old saved copies.
    if ('serviceWorker' in navigator) {
      const hadWorker = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadWorker) location.reload(); });
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
